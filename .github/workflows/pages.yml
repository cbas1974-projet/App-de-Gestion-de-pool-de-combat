# Publie l'application sur GitHub Pages à chaque push de la branche de travail,
# en poussant le dossier construit sur la branche gh-pages.
# Adresse : https://cbas1974-projet.github.io/App-de-Gestion-de-pool-de-combat/
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/cece-training-interface-9llm52]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publication du site"
