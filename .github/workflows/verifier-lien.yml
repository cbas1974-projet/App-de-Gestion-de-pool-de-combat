# Vérifie, depuis un vrai navigateur, que les adresses publiques de
# l'application fonctionnent (onglet Entraînement, images, aucune erreur).
# Se déclenche à chaque modification de ce fichier ou du script de vérification.
name: Vérifier des liens

on:
  push:
    branches: [claude/cece-training-interface-9llm52]
    paths:
      - .github/workflows/verifier-lien.yml
      - scripts/verifier_lien.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  URLS: >-
    https://htmlpreview.github.io/?https://raw.githubusercontent.com/cbas1974-projet/App-de-Gestion-de-pool-de-combat/publication/SGtraining.html
    https://rawcdn.githack.com/cbas1974-projet/App-de-Gestion-de-pool-de-combat/d40db9a4854a433f86ef93531db2141b268c1e9d/SGtraining.html
    https://cbas1974-projet.github.io/App-de-Gestion-de-pool-de-combat/

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core
      - name: En-têtes HTTP
        run: |
          for u in $URLS; do
            echo "=== $u"
            curl -sS -o /dev/null -D - -L --max-time 60 "$u" | grep -i -E "^HTTP|content-type|content-length|content-security|x-frame" || true
          done
      - name: Navigateur
        run: node scripts/verifier_lien.mjs $URLS
